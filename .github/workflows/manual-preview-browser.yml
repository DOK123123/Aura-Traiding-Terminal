name: Manual Preview Browser
on:
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Prepare test-only runtimes
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/pip install --no-deps -r ci/requirements.lock
          npm install --prefix "$RUNNER_TEMP/aura-browser" --no-save --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/aura-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Offline desktop and Android touch emulation (no production credentials)
        env:
          NODE_PATH: ${{ runner.temp }}/aura-browser/node_modules
        run: |
          export PYTHON="$PWD/.ci-venv/bin/python"
          export CHROMIUM="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          node scripts/verify_replay_alerts_browser.cjs work/replay-alerts-browser
          node scripts/verify_manual_strategies_browser.cjs work/strategies-browser
          node scripts/verify_hunter6_browser.cjs work/hunter6-browser
          node scripts/verify_preview_signals_browser.cjs work/preview-signals-browser
          node scripts/verify_issue66_browser.cjs work/issue66-browser
          node scripts/verify_signal_confidence_browser.cjs work/confidence-browser
          PYTHON="$PYTHON" node scripts/verify_manual_preview_chart.cjs work/chart-browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: manual-preview-browser-${{ github.event.pull_request.head.sha }}
          path: work/*browser
          if-no-files-found: warn
          retention-days: 7
