name: Aura 4.2 virtual-only scheduler
on:
  workflow_dispatch:
  schedule:
    # UTC: 02,07,...,57; avoid the start-of-hour scheduling peak.
    # GitHub schedule is best-effort, not a five-minute delivery guarantee.
    - cron: '2-59/5 * * * *'
permissions:
  contents: read
concurrency:
  group: aura-auto42
  cancel-in-progress: false
jobs:
  virtual_tick:
    if: vars.AURA_AUTO42_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed scheduler client
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Authenticated internal virtual settlement
        env:
          AURA_AUTO42_TICK_URL: ${{ secrets.AURA_AUTO42_TICK_URL }}
          AURA_AUTO42_SCHEDULER_SECRET: ${{ secrets.AURA_AUTO42_SCHEDULER_SECRET }}
        run: python scripts/auto42_scheduler.py
